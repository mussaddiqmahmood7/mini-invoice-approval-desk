services:
  postgres:
    image: postgres:16-alpine
    container_name: invoice_desk_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: invoice_desk
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invoice_desk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
